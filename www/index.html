  <script>
    const tabs = ['home', 'closet', 'sales', 'wants', 'outfits', 'pinterest'];
    function switchTab(tId) {
      tabs.forEach(t => {
        const v = document.getElementById('view-' + t); if (v) v.classList.add('hidden');
        const b = document.getElementById('tb-' + t);
        if (b) { b.classList.remove('bg-cyan-400', 'text-slate-950', 'font-bold'); b.classList.add('glass', 'text-slate-300'); }
      });
      const av = document.getElementById('view-' + tId); if (av) av.classList.remove('hidden');
      const ab = document.getElementById('tb-' + tId);
      if (ab) { ab.classList.remove('glass', 'text-slate-300'); ab.classList.add('bg-cyan-400', 'text-slate-950', 'font-bold'); }
    }
    function openModal() { document.getElementById('cam-modal').classList.remove('hidden'); }
    function closeModal() { document.getElementById('cam-modal').classList.add('hidden'); }
    function openDrawerModal() { document.getElementById('drawer-select-modal').classList.remove('hidden'); }
    function closeDrawerModal() { document.getElementById('drawer-select-modal').classList.add('hidden'); }
    function enterDrawer(drawer) {
      closeDrawerModal();
      currentDrawer = drawer;
      document.getElementById('closet-drawer-select').value = drawer;
      switchTab('closet');
      renderCarousel();
    }
    function changeDrawerDirect(drawer) { currentDrawer = drawer; renderCarousel(); }
    let closetVault = JSON.parse(localStorage.getItem('toy_vault_v15') || '[]');
    let currentDrawer = 'All';
    let myWants = JSON.parse(localStorage.getItem('toy_wants_v4') || '[]');
    function sortLightToDark() {
      closetVault.sort((a, b) => (b.luminance || 0) - (a.luminance || 0));
    }
    function saveAndSync() {
      sortLightToDark();
      localStorage.setItem('toy_vault_v15', JSON.stringify(closetVault));
      document.getElementById('total-vault-pieces').innerText = closetVault.length + ' Pieces Stored';
      renderCarousel();
      renderWeeklyOutfits();
    }
    function removeBackgroundAndGetLuminance(canvas) {
      const w = canvas.width, h = canvas.height;
      const ctx = canvas.getContext('2d');
      const imgData = ctx.getImageData(0, 0, w, h);
      const d = imgData.data;
      let bgR = 0, bgG = 0, bgB = 0, count = 0;
      for (let x = 0; x < w; x += 8) {
        let t = x * 4, b = ((h - 1) * w + x) * 4;
        bgR += d[t] + d[b]; bgG += d[t+1] + d[b+1]; bgB += d[t+2] + d[b+2]; count += 2;
      }
      for (let y = 0; y < h; y += 8) {
        let l = (y * w) * 4, r = (y * w + (w - 1)) * 4;
        bgR += d[l] + d[r]; bgG += d[l+1] + d[r+1]; bgB += d[l+2] + d[r+2]; count += 2;
      }
      bgR /= count; bgG /= count; bgB /= count;
      const topHangerLimit = Math.floor(h * 0.12);
      let totalLum = 0, garmentPixels = 0;
      for (let y = 0; y < h; y++) {
        for (let x = 0; x < w; x++) {
          const idx = (y * w + x) * 4;
          if (y < topHangerLimit) { d[idx + 3] = 0; continue; }
          const r = d[idx], g = d[idx+1], b = d[idx+2];
          const dist = Math.sqrt((r - bgR)**2 + (g - bgG)**2 + (b - bgB)**2);
          let isEdge = false;
          if (x < w - 2 && y < h - 2) {
            const nextX = (y * w + (x + 2)) * 4;
            const nextY = ((y + 2) * w + x) * 4;
            if (Math.abs(d[idx] - d[nextX]) + Math.abs(d[idx] - d[nextY]) > 14) isEdge = true;
          }
          if (dist > 22 || isEdge) {
            d[idx + 3] = 255;
            totalLum += (0.299 * r + 0.587 * g + 0.114 * b);
            garmentPixels++;
          } else {
            d[idx + 3] = 0;
          }
        }
      }
      ctx.putImageData(imgData, 0, 0);
      return garmentPixels > 0 ? Math.round(totalLum / garmentPixels) : 128;
    }
    function processPrecisionUpload(input) {
      closeModal();
      if (!input.files || input.files.length === 0) return;
      const targetDrawer = document.getElementById('modal-drawer-choice').value;
      Array.from(input.files).forEach(file => {
        const reader = new FileReader();
        reader.onload = function(e) {
          const img = new Image();
          img.onload = function() {
            const cvs = document.createElement('canvas');
            const max = 1200;
            let w = img.width, h = img.height;
            if (w > h && w > max) { h = Math.round(h * max / w); w = max; }
            else if (h > max) { w = Math.round(w * max / h); h = max; }
            cvs.width = w; cvs.height = h;
            cvs.getContext('2d').drawImage(img, 0, 0, w, h);
            const lum = removeBackgroundAndGetLuminance(cvs);
            const dataUrl = cvs.toDataURL('image/png');
            closetVault.unshift({
              id: Date.now() + Math.random(),
              src: dataUrl,
              drawer: targetDrawer,
              luminance: lum,
              notes: ""
            });
            saveAndSync();
            enterDrawer(targetDrawer);
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      });
      input.value = '';
    }
    const allDrawers = ["Skirts", "Shirts", "Pants", "Shorts", "Jackets", "Sweaters", "Shoes", "Purses", "Hats", "Jewelry", "Glasses", "Perfume"];
    function renderCarousel() {
      sortLightToDark();
      const items = (currentDrawer === 'All') ? closetVault : closetVault.filter(i => i.drawer === currentDrawer);
      const track = document.getElementById('carousel-track');
      if (items.length === 0) {
        track.innerHTML = '<div class="w-full glass rounded-3xl p-10 text-center space-y-2 border border-dashed border-slate-700"><i class="fa-solid fa-box-open text-4xl text-cyan-400 mb-1"></i><p class="text-sm font-bold text-white">' + currentDrawer + ' Drawer is Empty</p><p class="text-xs text-slate-400">Tap "+ Upload" to add items directly to this drawer.</p></div>';
        return;
      }
      track.innerHTML = items.map(item => `
        <div class="carousel-item glass rounded-3xl p-3 border border-slate-800 space-y-3 relative group" draggable="true" ondragstart="handleDragStart(event, '${item.id}')">
          <div class="w-full h-72 rounded-2xl bg-[#09111e] overflow-hidden relative cursor-zoom-in flex items-center justify-center p-2" onclick="openLightbox('${item.src}', '${item.drawer}')">
            <img src="${item.src}" class="max-h-full max-w-full object-contain drop-shadow-[0_12px_24px_rgba(0,0,0,0.85)]">
            <span class="absolute top-2 left-2 text-[10px] uppercase font-bold px-2.5 py-1 rounded-full bg-black/80 text-cyan-400 border border-cyan-400/40">${item.drawer}</span>
            <div class="absolute top-2 right-2 flex gap-1.5" onclick="event.stopPropagation()">
              <button onclick="togglePencilDrawer('${item.id}')" class="w-7 h-7 rounded-full bg-black/80 text-cyan-400 border border-cyan-400/50 flex items-center justify-center text-xs hover:bg-cyan-400 hover:text-black shadow"><i class="fa-solid fa-pencil"></i></button>
              <button onclick="toggleNotesBox('${item.id}')" class="w-7 h-7 rounded-full bg-black/80 text-purple-300 border border-purple-400/50 flex items-center justify-center text-xs hover:bg-purple-400 hover:text-black shadow"><i class="fa-solid fa-plus"></i></button>
            </div>
          </div>
          <div id="drawer-override-${item.id}" class="hidden p-2.5 bg-slate-950 border border-cyan-400 rounded-2xl space-y-1.5">
            <p class="text-[10px] text-cyan-400 font-bold uppercase">Move Piece To:</p>
            <div class="grid grid-cols-3 gap-1 text-[10px]">
              ${allDrawers.map(d => `<button onclick="reassignDrawer('${item.id}', '${d}')" class="p-1 rounded bg-slate-900 hover:bg-cyan-400 hover:text-black text-white truncate text-center ${item.drawer === d ? 'border border-cyan-400' : ''}">${d}</button>`).join('')}
            </div>
          </div>
          <div id="notes-box-${item.id}" class="${item.notes ? '' : 'hidden'} p-2.5 bg-slate-950/90 border border-purple-400/50 rounded-2xl space-y-1.5">
            <p class="text-[10px] text-purple-300 font-bold uppercase">Styling &amp; Piece Notes:</p>
            <textarea onchange="updateItemNotes('${item.id}', this.value)" placeholder="Add notes (e.g., Size, fabric, dry clean)..." class="w-full bg-slate-900 border border-slate-700 rounded-xl p-2 text-xs text-white h-14 resize-none">${item.notes || ''}</textarea>
          </div>
          <div class="flex items-center gap-2 pt-1">
            <button onclick="stageItemOnMannequin('${item.id}')" class="flex-1 py-2 bg-gradient-to-r from-teal-700 to-cyan-400 text-slate-950 font-bold rounded-xl text-xs active:scale-95 flex items-center justify-center gap-1.5">
              <i class="fa-solid fa-person-dress"></i> <span>Stage on Model</span>
            </button>
            <button onclick="deletePiece('${item.id}')" class="w-9 h-9 rounded-xl glass text-slate-500 hover:text-red-400 flex items-center justify-center"><i class="fa-solid fa-trash text-xs"></i></button>
          </div>
        </div>
      `).join('');
    }
    function openLightbox(src, title) {
      document.getElementById('lightbox-img').src = src;
      document.getElementById('lightbox-title').innerText = title + ' (Full Resolution Cutout)';
      document.getElementById('image-lightbox').classList.remove('hidden');
    }
    function closeLightbox() { document.getElementById('image-lightbox').classList.add('hidden'); }
    function togglePencilDrawer(id) { document.getElementById('drawer-override-' + id).classList.toggle('hidden'); }
    function toggleNotesBox(id) { document.getElementById('notes-box-' + id).classList.toggle('hidden'); }
    function reassignDrawer(id, newDrawer) {
      const item = closetVault.find(i => String(i.id) === String(id));
      if (!item) return;
      item.drawer = newDrawer;
      saveAndSync();
    }
    function updateItemNotes(id, text) {
      const item = closetVault.find(i => String(i.id) === String(id));
      if (!item) return;
      item.notes = text;
      localStorage.setItem('toy_vault_v15', JSON.stringify(closetVault));
    }
    function deletePiece(id) {
      closetVault = closetVault.filter(i => String(i.id) !== String(id));
      saveAndSync();
    }
    let draggedItemId = null;
    function handleDragStart(e, id) { draggedItemId = id; e.dataTransfer.setData("text/plain", id); }
    function allowDrop(e) { e.preventDefault(); }
    function handleMiniDrop(e) {
      e.preventDefault();
      const id = e.dataTransfer.getData("text/plain") || draggedItemId;
      if (id) stageItemOnMannequin(id);
    }
    function stageItemOnMannequin(id) {
      const item = closetVault.find(i => String(i.id) === String(id));
      if (!item) return;
      const d = item.drawer.toLowerCase();
      let slotType = 'top';
      if (d === 'pants' || d === 'shorts' || d === 'skirts') slotType = 'bottom';
      else if (d === 'shoes') slotType = 'shoes';
      const mini = document.getElementById('mini-slot-' + slotType);
      mini.innerHTML = `<img src="${item.src}" class="w-full h-full object-contain">`;
      mini.style.borderColor = '#00F0FF';
      const stage = document.getElementById('stage-slot-' + slotType);
      stage.innerHTML = `<img src="${item.src}" class="w-full h-full object-contain"><span class="absolute bottom-1 right-2 text-[9px] bg-black/80 px-2 py-0.5 rounded text-cyan-400 font-bold">${item.drawer}</span>`;
      stage.style.borderColor = '#00F0FF';
    }
    let miniClickTimer = null;
    function onMiniModelClick() {
      if (miniClickTimer === null) {
        miniClickTimer = setTimeout(() => { miniClickTimer = null; openDressingRoom(); }, 260);
      } else {
        clearTimeout(miniClickTimer);
        miniClickTimer = null;
        resetDressedFit();
      }
    }
    function resetDressedFit() {
      document.getElementById('mini-slot-top').innerHTML = '<i class="fa-solid fa-shirt text-[9px] text-slate-500"></i>';
      document.getElementById('mini-slot-bottom').innerHTML = '<i class="fa-solid fa-person-dress text-[9px] text-slate-500"></i>';
      document.getElementById('mini-slot-shoes').innerHTML = '<i class="fa-solid fa-shoe-prints text-[8px] text-slate-500"></i>';
      document.getElementById('stage-slot-top').innerHTML = '<span class="text-xs text-slate-500"><i class="fa-solid fa-shirt mr-1"></i> Empty Top</span>';
      document.getElementById('stage-slot-bottom').innerHTML = '<span class="text-xs text-slate-500"><i class="fa-solid fa-person-dress mr-1"></i> Empty Bottom</span>';
      document.getElementById('stage-slot-shoes').innerHTML = '<span class="text-xs text-slate-500"><i class="fa-solid fa-shoe-prints mr-1"></i> Empty Shoes</span>';
    }
    function openDressingRoom() { document.getElementById('dressing-room-modal').classList.remove('hidden'); }
    function closeDressingRoom() { document.getElementById('dressing-room-modal').classList.add('hidden'); }
    function returnToDrawer(drawer) { closeDressingRoom(); enterDrawer(drawer); }
    function rotateModel(deg) {
      document.getElementById('mannequin-3d-stage').style.transform = `rotateY(${deg}deg)`;
      document.getElementById('rotation-angle-label').innerText = `${deg}°`;
    }
    let isAutoSpinning = false, spinInterval = null;
    function toggleAutoSpin() {
      const btn = document.getElementById('auto-spin-btn'), slider = document.getElementById('rotation-slider');
      if (!isAutoSpinning) {
        isAutoSpinning = true;
        btn.innerText = 'Auto Spin: ON';
        btn.classList.replace('bg-cyan-400', 'bg-purple-500');
        spinInterval = setInterval(() => {
          let cur = (parseInt(slider.value) + 2) % 360;
          slider.value = cur;
          rotateModel(cur);
        }, 40);
      } else {
        isAutoSpinning = false;
        clearInterval(spinInterval);
        btn.innerText = 'Auto Spin: OFF';
        btn.classList.replace('bg-purple-500', 'bg-cyan-400');
      }
    }
    const salesFeed = [
      { id: 101, brand: "AQUAZZURA", title: "Crystal & Metallic Evening Stiletto Drop", discount: "50% OFF VIP", url: "https://www.aquazzura.com", img: "https://images.unsplash.com/photo-1543163521-1bf539c55dd2?auto=format&fit=crop&w=600&q=80" },
      { id: 102, brand: "ZARA SUITING", title: "Emerald Silk Double-Breasted Blazer & Trousers", discount: "NEW ARRIVAL", url: "https://www.zara.com", img: "https://images.unsplash.com/photo-1591047139829-d91aecb6caea?auto=format&fit=crop&w=600&q=80" },
      { id: 103, brand: "TELFAR", title: "Medium Metallic Shopping Bag Drop", discount: "BAG SECURITY", url: "https://telfar.net", img: "https://images.unsplash.com/photo-1584917865442-de89df76afd3?auto=format&fit=crop&w=600&q=80" },
      { id: 104, brand: "COACH OUTLET", title: "Signature Leather Satchel & Card Case", discount: "60% + 20% OFF", url: "https://www.coachoutlet.com", img: "https://images.unsplash.com/photo-1566150905458-1bf1fc113f0d?auto=format&fit=crop&w=600&q=80" },
      { id: 105, brand: "NIKE / JORDAN", title: "Retro 4 & Custom AF1 Low Cut", discount: "MEMBER ACCESS", url: "https://www.nike.com", img: "https://images.unsplash.com/photo-1552346154-21d32810aba3?auto=format&fit=crop&w=600&q=80" },
      { id: 106, brand: "DSW SHOES", title: "Over-the-Knee Lug Boots & Platform Pumps", discount: "BOGO 50% OFF", url: "https://www.dsw.com", img: "https://images.unsplash.com/photo-1543163521-1bf539c55dd2?auto=format&fit=crop&w=600&q=80" }
    ];
    function renderSalesFeed() {
      const container = document.getElementById('sales-feed-container');
      container.innerHTML = salesFeed.map(item => {
        const isHearted = myWants.some(w => w.id === item.id);
        return `
          <div class="glass rounded-3xl p-4 border border-slate-800 space-y-3 relative group">
            <div class="w-full h-52 rounded-2xl bg-black overflow-hidden relative cursor-pointer" onclick="window.open('${item.url}', '_blank')">
              <img src="${item.img}" class="w-full h-full object-cover">
              <span class="absolute top-2.5 left-2.5 text-[10px] font-black px-2.5 py-1 rounded-full bg-black/80 text-cyan-400 border border-cyan-400/40">${item.brand}</span>
              <span class="absolute top-2.5 right-2.5 text-[10px] font-bold px-2 py-0.5 rounded-full bg-purple-950 text-purple-200 border border-purple-500/40">${item.discount}</span>
            </div>
            <div class="flex justify-between items-center px-1">
              <div class="flex-1 pr-2 cursor-pointer" onclick="window.open('${item.url}', '_blank')">
                <h3 class="text-xs font-black text-white leading-tight">${item.title}</h3>
                <p class="text-[10px] text-cyan-400 font-bold mt-0.5">Tap to shop at ${item.brand} &rarr;</p>
              </div>
              <button onclick="toggleHeartWant(${item.id})" class="w-10 h-10 rounded-full glass flex items-center justify-center transition-all ${isHearted ? 'bg-purple-600 text-white shadow-[0_0_15px_rgba(168,85,247,0.8)]' : 'text-slate-400'}">
                <i class="fa-solid fa-heart ${isHearted ? 'text-white' : 'text-slate-400'}"></i>
              </button>
            </div>
          </div>
        `;
      }).join('');
    }
    function toggleHeartWant(itemId) {
      const item = salesFeed.find(s => s.id === itemId);
      if (!item) return;
      const idx = myWants.findIndex(w => w.id === itemId);
      if (idx >= 0) { myWants.splice(idx, 1); }
      else { myWants.unshift(item); }
      localStorage.setItem('toy_wants_v4', JSON.stringify(myWants));
      updateWantsUI();
      renderSalesFeed();
    }
    function updateWantsUI() {
      document.getElementById('wants-count').innerText = myWants.length;
      document.getElementById('wants-badge').innerText = myWants.length;
      const container = document.getElementById('wants-container');
      if (myWants.length === 0) {
        container.innerHTML = '<div class="col-span-2 glass rounded-2xl p-6 text-center text-xs text-slate-400">No favorited items yet. Tap the heart on items in the Sales Feed to add them to your Wants!</div>';
        return;
      }
      container.innerHTML = myWants.map(item => `
        <div class="glass rounded-2xl p-2.5 border border-purple-400/40 space-y-2">
          <div class="w-full h-36 rounded-xl bg-black overflow-hidden relative cursor-pointer" onclick="window.open('${item.url}', '_blank')">
            <img src="${item.img}" class="w-full h-full object-cover">
            <span class="absolute top-1 left-1 text-[8px] bg-black/80 px-1.5 py-0.5 rounded text-cyan-400 font-bold">${item.brand}</span>
          </div>
          <p class="text-[11px] font-bold text-white truncate">${item.title}</p>
          <div class="flex justify-between items-center pt-1">
            <span class="text-[9px] text-purple-300 font-bold">${item.discount}</span>
            <button onclick="toggleHeartWant(${item.id})" class="text-purple-400 text-xs"><i class="fa-solid fa-trash"></i></button>
          </div>
        </div>
      `).join('');
    }
    function renderWeeklyOutfits() {
      const days = ["Monday • Executive Briefing", "Tuesday • Strategy Session", "Wednesday • Client Presentation", "Thursday • Corporate Dinner", "Friday • Luxe Casual", "Saturday • Gala / Evening Out", "Sunday • Brunch & Reflection"];
      const container = document.getElementById('weekly-outfits-list');
      container.innerHTML = days.map((day) => `
        <div class="glass rounded-2xl p-3.5 border border-slate-800 space-y-2">
          <div class="flex justify-between items-center">
            <span class="text-xs font-black text-cyan-400 uppercase">${day}</span>
            <span class="text-[9px] text-slate-400 font-mono">Weather Sync: Cleared</span>
          </div>
          <div class="grid grid-cols-4 gap-2 py-1">
            <div class="h-16 rounded-xl bg-black/50 border border-dashed border-cyan-400/40 flex items-center justify-center text-[10px] text-slate-400 font-bold text-center">Top / Jacket</div>
            <div class="h-16 rounded-xl bg-black/50 border border-dashed border-purple-400/40 flex items-center justify-center text-[10px] text-slate-400 font-bold text-center">Skirt / Pant</div>
            <div class="h-16 rounded-xl bg-black/50 border border-dashed border-pink-400/40 flex items-center justify-center text-[10px] text-slate-400 font-bold text-center">Stiletto / Shoe</div>
            <div class="h-16 rounded-xl bg-black/50 border border-dashed border-amber-400/40 flex items-center justify-center text-[10px] text-slate-400 font-bold text-center">Purse &amp; Scent</div>
          </div>
          <div class="flex justify-between items-center text-[10px] text-slate-400 pt-1">
            <span>Tap to view pieces</span>
            <span class="text-cyan-400 font-bold">Double-tap: Dress 360° Model</span>
          </div>
        </div>
      `).join('');
    }
    document.addEventListener('DOMContentLoaded', () => {
      saveAndSync();
      renderSalesFeed();
      updateWantsUI();
    });
  </script>
</body>
</html>
